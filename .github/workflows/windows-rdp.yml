
name: Windows Tools Setup

on:
  push:
    paths:
      - ".github/workflows/windows-rdp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-setup:
    name: Windows Setup
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Windows information
        shell: pwsh
        run: |
          Write-Host "Windows environment started"
          Get-ComputerInfo |
            Select-Object WindowsProductName,
              WindowsVersion,
              OsArchitecture

      - name: Install Google Chrome and VS Code
        shell: pwsh
        run: |
          choco install googlechrome vscode -y --no-progress

      - name: Verify installations
        shell: pwsh
        run: |
          Write-Host "Checking installed applications"

          if (Test-Path
            "C:\Program Files\Google\Chrome\Application\chrome.exe") {
            Write-Host "Google Chrome installed"
          }

          if (Test-Path
            "$env:ProgramFiles\Microsoft VS Code\Code.exe") {
            Write-Host "Visual Studio Code installed"
          }

      - name: Finish
        shell: pwsh
        run: |
          Write-Host "Windows setup completed successfully"
          
